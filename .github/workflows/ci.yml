name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check .

  package:
    # Catches a wheel that silently leaves out a subpackage (ADR 0010).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip wheel . --no-deps -w dist
      - name: Wheel contains every subpackage
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for pkg in ("marginalia/brain/", "marginalia/ui/"):
              assert any(n.startswith(pkg) for n in names), f"{pkg} missing from wheel: {names}"
          print("ok:", len(names), "files")
          PY

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
        exclude:
          - os: macos-latest
            python: "3.10"
          - os: windows-latest
            python: "3.10"
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      # Only the dev extra: the suite must pass without OCR or voice installed, like a fresh user's machine.
      - run: pip install -e ".[dev]"
      - run: pytest --cov=marginalia --cov-report=term-missing
