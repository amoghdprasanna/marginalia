name: Release

# Push a tag like v0.2.0 (made by scripts/release.py, see docs/releasing.md). This checks the
# tag against __version__ and the changelog, runs the tests, builds the wheel, the macOS app,
# the Windows app, the Linux package and the Chrome extension, and publishes a GitHub release
# with the changelog section as its notes.
#
# Every push to main builds the same files and replaces the "latest-main" prerelease with them,
# so the newest build is always downloadable. The app's update check ignores prereleases, so
# installed copies still update only to tagged releases.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:  # a dry run from the Actions tab: builds everything, publishes nothing

permissions:
  contents: write

# A newer push to main supersedes a build still running; tagged releases always finish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag, version and changelog agree
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/release.py --check "${GITHUB_REF_NAME}"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: pip install -e ".[dev]"
      - run: pytest -q

  wheel:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*

  macos:
    needs: check
    runs-on: macos-15  # Apple silicon; see ADR 0023 for Intel
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Import the Developer ID certificate
        if: env.MACOS_CERT_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
      - run: pip install -e ".[package,ocr,voice,openai,gemini]"
      - run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dist/*.dmg

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[package,ocr,voice,openai,gemini]"
      # Inno Setup builds the installer (ADR 0028); it is no longer preinstalled on every runner image.
      - run: choco install innosetup --yes --no-progress
      - run: python packaging/build.py
      - name: The installer was built
        shell: bash
        run: ls dist/*-windows-setup.exe
      - name: Install, update and uninstall the app
        run: python packaging/windows/smoke_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: dist/*-windows-setup.exe

  linux:
    needs: check
    # The oldest supported Ubuntu, so the .deb runs on it and everything newer (glibc is forward-compatible).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 libportaudio2
      - run: pip install -e ".[package,ocr,voice,openai,gemini]"
      - run: python packaging/build.py
      - name: Install, start and remove the package (ADR 0033)
        run: |
          sudo apt-get install -y ./dist/marginalia_*_amd64.deb
          marginalia --help
          test -f /usr/share/applications/marginalia.desktop
          grep -q '"/opt/marginalia/Marginalia"' /etc/opt/chrome/native-messaging-hosts/marginalia.browser.json
          sudo apt-get remove -y marginalia
          test ! -e /opt/marginalia/Marginalia
      - uses: actions/upload-artifact@v4
        with:
          name: linux-app
          path: dist/*.deb

  extension:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci && npm run check && npm run zip
        working-directory: extension
      - name: Name it after the release
        run: |
          VERSION=$(python3 -c "import sys; sys.path.insert(0, 'src'); from marginalia import __version__; print(__version__)")
          mkdir -p dist && mv extension/.output/*-chrome.zip "dist/Marginalia-${VERSION}-chrome-extension.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: dist/*.zip

  publish:
    needs: [wheel, macos, windows, linux, extension]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: python scripts/release.py --notes "${GITHUB_REF_NAME}" > notes.md
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "Marginalia ${GITHUB_REF_NAME#v}" --notes-file notes.md artifacts/*

  publish-main:
    needs: [wheel, macos, windows, linux, extension]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Write the notes
        run: |
          cat > notes.md <<EOF
          The newest build from \`main\` ([\`${GITHUB_SHA::7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})), built $(date -u '+%Y-%m-%d %H:%M UTC').
          It is replaced on every change to \`main\` and may be less tested than a numbered release.
          The app does not update itself to it.
          EOF
      - name: Replace the latest-main prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest-main --cleanup-tag --yes || true
          gh release create latest-main --prerelease --target "${GITHUB_SHA}" \
            --title "Latest build from main (${GITHUB_SHA::7})" --notes-file notes.md artifacts/*
