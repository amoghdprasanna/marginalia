[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "marginalia"
dynamic = ["version"]
description = "A screen-aware study companion that answers questions and points at things."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "pillow>=10.0",
    "anthropic>=1.11",
    "pynput>=1.7.7",
    "python-dotenv>=1.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Exact text for small fonts, and boxes the pointer can snap to. Bundles its models.
ocr = ["rapidocr_onnxruntime>=1.3"]
# Ask by voice. Local Whisper; the model downloads once on first run.
voice = ["faster-whisper>=1.0", "sounddevice>=0.4.6"]
dev = ["pytest>=8", "pytest-qt>=4.4", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
marginalia = "marginalia.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "marginalia.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "eval"]
qt_api = "pyside6"
markers = [
    "unit: pure logic, no Qt event loop (tests/unit)",
    "ui: one widget at a time under pytest-qt (tests/ui)",
    "integration: the controller end to end with fakes (tests/integration)",
    "qt: needs a Qt application (runs offscreen in CI)",
]
addopts = "--strict-markers"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = [
    "N802",  # Qt overrides are camelCase by necessity
    "E741",  # `l` for a TextLine reads fine here
    "N806",  # W, H for image width/height, as in the API docs
]

[tool.ruff.lint.per-file-ignores]
"src/marginalia/brain/prompt.py" = ["E501"]  # the system prompt is prose; wrapping it would change the prompt
